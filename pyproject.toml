[project]
name = "novaconfig"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["typer>=0.16,<1"]
[project.scripts]
novaconfig = "novaconfig:app"
[tool.hatch.build.targets.wheel]
packages = ["src/novaconfig"]
license = {text = "Apache-2.0"}
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
